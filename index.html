<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #33cc66;
    }

    h1 {
      text-align: center;
      padding: 20px 10px 10px;
      margin: 0;
      color: #33cc66;
      letter-spacing: 2px;
    }

    audio {
      width: 100%;
      position: sticky;
      top: 0;
      background: #000;
      padding: 10px;
      box-sizing: border-box;
      border-bottom: 1px solid #222;
    }

    #playlist {
      width: 100%;
    }

    .track {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding: 14px 12px;
      box-sizing: border-box;
      cursor: pointer;
      transition: 0.15s;
      border-bottom: 1px solid #111;
    }

    /* NOT PLAYING (default black bar) */
    .track {
      background: #000;
    }

    .num {
      width: 35px;
      color: #339966;
      font-weight: bold;
      flex-shrink: 0;
    }

    .name {
      color: #33cc66;
    }

    /* HOVER */
    .track:hover {
      background: #111;
    }

    /* ACTIVE / PLAYING STATE */
    .track.active {
      background: #33cc66;
    }

    .track.active .name {
      color: #000;
      font-weight: bold;
    }

    .track.active .num {
      color: #339966;
    }
  </style>
</head>

<body>

<h1>THOUGHTS</h1>

<audio id="player" controls></audio>

<div id="playlist">

  <div class="track"><span class="num">01</span><span class="name">Magnetic Golden Laugh (I am a banana)</span></div>
  <div class="track"><span class="num">02</span><span class="name">Let Me Watch the Footie</span></div>
  <div class="track"><span class="num">03</span><span class="name">Oh Mama</span></div>
  <div class="track"><span class="num">04</span><span class="name">Dog Man</span></div>
  <div class="track"><span class="num">05</span><span class="name">Before You Can't</span></div>
  <div class="track"><span class="num">06</span><span class="name">Europa Park</span></div>
  <div class="track"><span class="num">07</span><span class="name">Teach Her to Shine</span></div>
  <div class="track"><span class="num">08</span><span class="name">The Brothers-In-Law</span></div>
  <div class="track"><span class="num">09</span><span class="name">Normal Version of Me</span></div>
  <div class="track"><span class="num">10</span><span class="name">CAnned DAmaging SILence</span></div>
  <div class="track"><span class="num">11</span><span class="name">Treasure Hunt</span></div>
  <div class="track"><span class="num">12</span><span class="name">My Old Man (bonus track)</span></div>

</div>

<script>
const tracks = [
  "01_Magnetic_Golden_Laugh_I_am_a_banana.mp3",
  "02_Let_Me_Watch_the_Footie.mp3",
  "03_Oh_Mama.mp3",
  "04_Dog_Man.mp3",
  "05_Before_You_Cant.mp3",
  "06_Europa_Park.mp3",
  "07_Teach_Her_to_Shine.mp3",
  "08_The_Brothers_In_Law.mp3",
  "09_Normal_Version_of_Me.mp3",
  "10_CAnned_DAmaging_SILence.mp3",
  "11_Treasure_Hunt.mp3",
  "12_My_Old_Man_bonus_track.mp3"
];

const player = document.getElementById("player");
const trackElements = document.querySelectorAll(".track");
let currentIndex = 0;

function playTrack(index) {
  currentIndex = index;
  player.src = tracks[index];
  player.play();

  trackElements.forEach(t => t.classList.remove("active"));
  trackElements[index].classList.add("active");
}

trackElements.forEach((el, i) => {
  el.addEventListener("click", () => playTrack(i));
});

player.addEventListener("ended", () => {
  currentIndex++;
  if (currentIndex < tracks.length) {
    playTrack(currentIndex);
  }
});
</script>

</body>
</html>
