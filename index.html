<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #00ff88;
    }

    /* TRACK LIST */
    .track {
      padding: 16px 14px;
      font-size: 16px;
      cursor: pointer;
      color: #00ff88;
      user-select: none;
    }

    /* ACTIVE = full-width green bar */
    .track.active {
      background: #00ff88;
      color: #000;
      width: 100%;
    }

    /* remove tap highlight / feel smoother */
    .track:active {
      opacity: 0.7;
    }

    /* audio hidden (no controls UI) */
    audio {
      display: none;
    }
  </style>
</head>

<body>

<audio id="player"></audio>

<div id="list">
  <div class="track">Magnetic Golden Laugh</div>
  <div class="track">Let Me Watch the Footie</div>
  <div class="track">Oh Mama</div>
  <div class="track">Dog Man</div>
  <div class="track">Before You Can't</div>
  <div class="track">Europa Park</div>
  <div class="track">Teach Her to Shine</div>
  <div class="track">The Brothers-In-Law</div>
  <div class="track">Normal Version of Me</div>
  <div class="track">CAnned DAmaging SILence</div>
  <div class="track">Treasure Hunt</div>
  <div class="track">My Old Man (bonus track)</div>
</div>

<script>
const tracks = [
  "01_Magnetic_Golden_Laugh_I_am_a_banana.mp3",
  "02_Let_Me_Watch_the_Footie.mp3",
  "03_Oh_Mama.mp3",
  "04_Dog_Man.mp3",
  "05_Before_You_Cant.mp3",
  "06_Europa_Park.mp3",
  "07_Teach_Her_to_Shine.mp3",
  "08_The_Brothers_In_Law.mp3",
  "09_Normal_Version_of_Me.mp3",
  "10_CAnned_DAmaging_SILence.mp3",
  "11_Treasure_Hunt.mp3",
  "12_My_Old_Man_bonus_track.mp3"
];

const player = document.getElementById("player");
const items = document.querySelectorAll(".track");

let current = -1;
let isPlaying = false;

function playTrack(i) {
  if (current === i && isPlaying) {
    player.pause();
    isPlaying = false;
    items[i].classList.remove("active");
    return;
  }

  current = i;
  player.src = tracks[i];
  player.play();
  isPlaying = true;

  items.forEach(el => el.classList.remove("active"));
  items[i].classList.add("active");
}

/* tap handler */
items.forEach((el, i) => {
  el.addEventListener("click", () => playTrack(i));
});

/* autoplay next */
player.addEventListener("ended", () => {
  current++;
  if (current < tracks.length) {
    playTrack(current);
  }
});
</script>

</body>
</html>
