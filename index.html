<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f0b;
      color: #00ff88;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 20px 10px 10px;
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* PLAYER (sticky bottom like Spotify) */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #111;
      border-top: 1px solid #00ff88;
      padding: 10px;
      box-sizing: border-box;
    }

    audio {
      width: 100%;
    }

    /* TRACK LIST */
    .list {
      padding: 10px 10px 120px; /* space for player bar */
    }

    .track {
      background: #111;
      border: 1px solid #00ff88;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    /* no hover dependency — mobile friendly */
    .track:active {
      transform: scale(0.98);
      background: #00ff88;
      color: #000;
    }

    .active {
      background: #00ff88 !important;
      color: #000 !important;
    }
  </style>
</head>

<body>

<div class="header">THOUGHTS</div>

<div class="list" id="playlist">
  <div class="track">01 Magnetic Golden Laugh (I am a banana)</div>
  <div class="track">02 Let Me Watch the Footie</div>
  <div class="track">03 Oh Mama</div>
  <div class="track">04 Dog Man</div>
  <div class="track">05 Before You Can't</div>
  <div class="track">06 Europa Park</div>
  <div class="track">07 Teach Her to Shine</div>
  <div class="track">08 The Brothers-In-Law</div>
  <div class="track">09 Normal Version of Me</div>
  <div class="track">10 CAnned DAmaging SILence</div>
  <div class="track">11 Treasure Hunt</div>
  <div class="track">12 My Old Man (bonus track)</div>
</div>

<!-- sticky mini player -->
<div class="player-bar">
  <audio id="player" controls></audio>
</div>

<script>
const tracks = [
  "01_Magnetic_Golden_Laugh_I_am_a_banana.mp3",
  "02_Let_Me_Watch_the_Footie.mp3",
  "03_Oh_Mama.mp3",
  "04_Dog_Man.mp3",
  "05_Before_You_Cant.mp3",
  "06_Europa_Park.mp3",
  "07_Teach_Her_to_Shine.mp3",
  "08_The_Brothers_In_Law.mp3",
  "09_Normal_Version_of_Me.mp3",
  "10_CAnned_DAmaging_SILence.mp3",
  "11_Treasure_Hunt.mp3",
  "12_My_Old_Man_bonus_track.mp3"
];

let currentIndex = 0;

const player = document.getElementById("player");
const trackElements = document.querySelectorAll(".track");

function playTrack(i) {
  currentIndex = i;
  player.src = tracks[i];
  player.play();

  trackElements.forEach(t => t.classList.remove("active"));
  trackElements[i].classList.add("active");
}

// tap-to-play
trackElements.forEach((t, i) => {
  t.addEventListener("click", () => playTrack(i));
});

// autoplay next
player.addEventListener("ended", () => {
  currentIndex++;
  if (currentIndex < tracks.length) {
    playTrack(currentIndex);
  }
});
</script>

</body>
</html>
